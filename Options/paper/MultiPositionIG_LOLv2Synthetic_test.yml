# Test-only candidate. Replace checkpoint path after verifying the released weight.
# Never run a training YAML with basicsr/test.py: it iterates every dataset entry.
name: MultiPositionIG_LOLv2Synthetic_test
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100
datasets:
  test:
    name: TestSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv2/Synthetic/Test/Normal
    dataroot_lq: data/LOLv2/Synthetic/Test/Low
    io_backend:
      type: disk
    val_batch_size: 4
    val_num_worker: 8
network_g:
  type: MultiPositionIlluminationGuidance
  in_channels: 3
  out_channels: 3
  n_feat: 40
  stage: 1
  num_blocks:
  - 1
  - 2
  - 2
path:
  pretrain_network_g: checkpoints/best_psnr_26.38_205500.pth
  strict_load_g: true
  param_key: params
train:
  mixing_augs:
    mixup: false
val:
  window_size: 4
  val_freq: 500.0
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
dist_params:
  backend: nccl
  port: 29500
