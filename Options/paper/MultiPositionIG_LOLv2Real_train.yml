# Release candidate reconstructed from Supplementary Tables S1-S2 and source templates.
# Source-provenance limitations are documented in README.md; do not claim this is an original run file.
name: MultiPositionIG_LOLv2Real
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv2/Real_captured/Train/Normal
    dataroot_lq: data/LOLv2/Real_captured/Train/Low
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    mini_batch_sizes:
    - 4
    iters:
    - 300000
    gt_size: 128
    gt_sizes:
    - 128
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv2/Real_captured/Test/Normal
    dataroot_lq: data/LOLv2/Real_captured/Test/Low
    io_backend:
      type: disk
    val_batch_size: 4
    val_num_worker: 8
network_g:
  type: MultiPositionIlluminationGuidance
  in_channels: 3
  out_channels: 3
  n_feat: 40
  stage: 1
  num_blocks:
  - 1
  - 2
  - 2
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  total_iter: 300000
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods:
    - 92000
    - 208000
    restart_weights:
    - 1
    - 1
    eta_mins:
    - 0.0001
    - 1.0e-06
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: Adam
    lr: 0.0004
    betas:
    - 0.9
    - 0.999
  pixel_opt:
    type: L1ColorPSNRLoss
    loss_weight: 1.0
    color_weight: 0.2
    psnr_weight: 0.05
    toY: false
val:
  window_size: 4
  val_freq: 50.0
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 50
  save_checkpoint_freq: 1000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
